name: Atualiza precos da eShop

on:
  schedule:
    # De 6 em 6 horas. Horario UTC; 17:00 UTC = 14:00 em Brasilia, quando sai
    # o resumo do dia.
    - cron: '0 5,11,17,23 * * *'
  workflow_dispatch:
    inputs:
      resumo:
        description: 'Mandar o resumo do dia no Telegram, mesmo fora do horario'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: precos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Guardar o estado anterior
        run: cp data.json "$RUNNER_TEMP/anterior.json"

      - name: Consultar a API da Nintendo
        id: precos
        run: |
          python update-prices.py | tee resultado.txt
          echo "mudou=$(grep -oP 'MUDOU=\K\d' resultado.txt)" >> "$GITHUB_OUTPUT"
          {
            echo '```'
            cat resultado.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm resultado.txt

      - name: Ler o canal de ofertas
        id: canal
        continue-on-error: true
        run: |
          python read-channel.py | tee canal.txt
          echo "mudou=$(grep -oP 'FISICO_MUDOU=\K\d' canal.txt)" >> "$GITHUB_OUTPUT"
          {
            echo '```'
            cat canal.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm canal.txt

      - name: Publicar
        run: |
          if git diff --quiet; then
            echo "nada a commitar"
            exit 0
          fi
          if [ "${{ steps.precos.outputs.mudou }}" = "1" ] && [ "${{ steps.canal.outputs.mudou }}" = "1" ]; then
            msg="Precos: eShop e midia fisica mudaram"
          elif [ "${{ steps.precos.outputs.mudou }}" = "1" ]; then
            msg="Precos da eShop: mudanca detectada"
          elif [ "${{ steps.canal.outputs.mudou }}" = "1" ]; then
            msg="Midia fisica: preco novo vindo do canal"
          else
            msg="Precos da eShop: conferido, sem mudanca"
          fi
          git config user.name "radar-eshop bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          git commit -m "$msg ($(date -u '+%d/%m %H:%M') UTC)"
          git push

      - name: Avisar promocao nova no Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify-telegram.py --novidades "$RUNNER_TEMP/anterior.json"

      - name: Resumo do dia no Telegram
        if: github.event.inputs.resumo == 'true' || github.event_name == 'schedule'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # No agendamento, so na rodada das 17:00 UTC (14:00 em Brasilia).
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%H)" != "17" ]; then
            echo "fora do horario do resumo"
            exit 0
          fi
          python notify-telegram.py --resumo
